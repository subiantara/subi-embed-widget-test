<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Staging activities widget</title>
  <style>body{font-family:system-ui,sans-serif;max-width:960px;margin:2rem auto;padding:0 16px;line-height:1.5}code{background:#f3f4f6;padding:0 4px;border-radius:4px}section{margin:2.5rem 0}</style>
</head>
<body>
  <h1>Client test page: activities widget</h1>
  <p>Staging (freya). Shows only when <b>Embeddable widgets → Activities list</b> is on for the storefront in staging Platform.Admin. <a href="./">All staging tests</a></p>
  <section>
    <h2>1. Default snippet</h2>
    <div data-travlr-activities data-city="Ubud" data-country="Indonesia"></div>
  </section>
  <section>
    <h2>2. Overrides from the page</h2>
    <div data-travlr-activities data-city="Sydney" data-country="Australia" data-currency="USD" data-limit="8"
         data-title="Things to do in Sydney" data-description="Hand-picked experiences around the harbour city."></div>
  </section>
  <section>
    <h2>3. Empty state</h2>
    <div data-travlr-activities data-city="Nowhereville" data-country="Atlantis"></div>
  </section>
  <script async src="https://static.freya.travlr.com/widgets/loader.js" data-key="tvl_pk_fWENaTEuIRhGL0jxlOmwT"></script>
</body>
</html>
